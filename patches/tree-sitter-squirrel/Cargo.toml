[package]
name = "tree-sitter-squirrel"
version = "1.0.0"
edition = "2021"
license = "MIT"
# Patched to use tree-sitter-language (tree-sitter 0.25 compatible API).
# parser.c is pre-compiled to lib/libtree_sitter_squirrel.a for wasm32-wasip2.
# Minimal build script emits link directives without using the cc crate.
build = "build.rs"
links = "tree_sitter_squirrel"

[lib]
name = "tree_sitter_squirrel"
path = "src/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"
